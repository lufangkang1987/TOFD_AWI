[SYS_Info]
Help_Num=60
Help_1=@<DAUT200  Ver1.4.9 2025.04.25   >帮助

Help_3=@1 功能特点
Help_5=   ).具备A扫、B扫、TOFD成像。
Help_7=   ).扫查记录长度不限。
Help_9=   ).回访图像记录每点的A扫描波形。
Help_11=   ).缺陷尺寸分析。
Help_13=  ).配有前视、探头视、后视。
Help_15=  ).探头架自动升降。
Help_17=  ).小手柄灵活控制车体运动。
Help_19= ).配置电脑的屏幕为触摸屏、2个USB口。

Help_21= @2 软件操作流程
Help_23= ).点击<TOFD参数>。
Help_25= ).进入<计算参数>中，计算平板或储罐的PCS值
Help_27= ).进入<探头校准>中，计算探头延时时间
Help_29= ).进入<探头校准>中，计算探头前沿参数
Help_31= ).将探头装在扫查器的探头支架上，并按照所计算出的PCS进行调整
Help_33= ).调整波形，使得A扫描图，出现直通波，底波，以及一次变形波，调整好后，点击<同步参数刷新名称>，<工艺文件保存>保存数据。
Help_35= ).下次检测同样工况，可选择<立式工艺文件>选择同样工艺的工艺文件
Help_37= ).点击<开始检测>
Help_39= ).输入项目名称、焊缝编号
Help_41= ).点击<工件参数>
Help_43= ).输入项目参数内容，输入完，点击窗体右上方?
Help_45= ).点击<确认>，开始检测
Help_47= ).观察TOFD图像
Help_49= ).确认有异常，可以在异常处打标：鼠标右键，点击打标，车体运行到此位置处，自动执行打标动作
Help_51= ).点击<当前界面缺陷标注>，确认缺陷的长度、高度、深度
Help_53= ).点击<缺陷样板图>,查看缺陷样板
Help_55= ).点击<停止检测>，检测完成
Help_57= ).点击<打印>，打印缺陷报表
Help_59= ).点击<数据备份>，将检测项目数据拷贝到指定位置
Help_61= ).点击<数据查询>，选择项目查看