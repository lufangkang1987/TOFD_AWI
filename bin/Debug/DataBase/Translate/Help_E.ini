Help_Num=53

Help_1=@<DEMA70A  Ver1.4.9 2025.04.25      EU Ver117>Help
Help_2=

Help_3=@1 The gap between probe / sensor and the component to be tested:  1.5mm is recommended, too narrow may cause the spurs on the measured surface to wear on the probe surface, excessive width can lead to pulsation of ultrasonic echo, instability of thickness measurement, or even no thickness measurement .
Help_5=   @2 Operating steps
Help_7=   ). Make sure the emergency stop button of the power box is pressed / disconnected and the power output button is pop-up / disconnected.
Help_9=   ). Connect all the cables.
Help_11=   ). Emergency stop button screw out and rising / on (host computer / tablet computer should be powered on first).
Help_13=   ). Start the host computer / tablet and wait for it to boot to the windows system.
Help_15=  ). The power output button is pressed / connected (the light on the button lights up, the car body contains the electromagnetic ultrasonic thickness measurement module is powered on).
Help_17=  ). Run the DEMA70A software, observe the communication online status indication, there should be video images and ultrasonic shapes.
Help_19=  ). If the communication fails / no ultrasonic shape, then reconnect: first pop out the power output button (the light on the button is off) >10s to make the vehicle body containing electromagnetic ultrasonic thickness measurement module completely power off, then press the power output button (the light on the button lights up) that is to be able to restart the communication handshake.
Help_21= ). Modify and confirm the information recording, scanning mode and data calibration in parameter setting.
Help_23= ). After the parameter setting is confirmed, the [Start inspecting] button will change from invalid gray state to effective, and the detection can start.

Help_25= ). After the inspecting, exit the software --->turn off the power of the host and wait for it to turn off to the black screen state.

Help_27= ).Turn off the power box (the emergency stop button of the power box is pressed / disconnected and the power output button is pop-up / disconnected) ---> unplug the power connector.

Help_29= ).Place and pull down the crawler

Help_31=@  (1) Because the magnetic wheel of the crawler has a large suction force, when the magnetic isolation pad is placed between the crawler and the member to be inspected, the adsorption force of the magnetic wheel can be greatly weakened, and the crawler can be conveniently placed or pulled down.

Help_33=@  (2) You need to place the magnetic isolation pad on the surface of the component to be inspected ---> place the crawler on the magnetic isolation pad ---> hold the crawler to prevent it from falling, and slowly manipulate the crawler to drive away from the magnetic isolation pad---> make sure that the crawler is firmly attached to the detection surface, and then evacuate the human hand---> perform normal inspection work---> after the inspection is completed, hold the crawler to prevent it from falling, and slowly control the crawler to enter or back to the magnetic isolation pad ---> hold the crawler with both hands and pull it off the inspected member.

Help_35=@  13).After work: clean the probe, cable and its connector--->remove the cable, place the components in the corresponding slot of the special anti-vibration box --->count all parts without missing ---> box lid And fasten.

Help_37=   @3 Software operation process
Help_39= ).Click [Parameter set.] and enter the setting interface to set  "Information records, Scanning method, Data calibration".
Help_41= ).Operation and setting of auxiliary functions

Help_43=@  (1) Ultrasonic monitoring window: Ultrasonic waveform can be viewed to set UT parameters (pulse number and frequency), modified sound speed (sound speed method calibration), A-scan displayed mode (Original, Detected, Filtered), algorithm (Auto, 2gates, 1 gate), accumulation, gain, X-axis length (thickness range), Y-axis unit (dB, %).
Help_45=@  (2)Video monitoring window: it can be adjust the lighting brightness, switch between front and rear camera, take photos , record videos.

Help_47=@ 3).Click [Console] and the console will pop up, after the motion control debugging is normal, click [Start inspecting] to start inspecting, click [Pause inspecting] and [Continue inspecting] during working. You can view "thickness value display area" display: real-time thickness, cumulative distance, maximum thickness, minimum thickness, inspecting date, nominal thickness.
Help_49=@ 4).Click [Stop inspecting] to stop inspecting. After close and exit console, you can view B-scan, C-scan, thickness list, 3D graphic in "data graphical display area".

Help_51=@ 5).Click [Data query] to enter data query, you can import, export, report generate, exit browsing. 
Help_53=@ 6).Click [Exit] to exit the software.


